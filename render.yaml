services:
  - type: web
    name: mies
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      # Base de datos PostgreSQL en Neon (plan gratuito). El valor se configura en Render, no aquí.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false
      - key: CONTACTO_CORREO
        sync: false
      - key: NODE_VERSION
        value: "22"
